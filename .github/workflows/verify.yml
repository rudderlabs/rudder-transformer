name: Verify

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  formatting-lint:
    name: Check for formatting & lint errors
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout repository code (actions/checkout)
      pull-requests: read # to list changed files in the PR (Ana06/get-changed-files)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Make sure the actual branch is checked out when running on pull requests
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci && npm run prepare

      - name: Run format check
        run: npm run format:ci

      - id: files
        uses: Ana06/get-changed-files@a2f6df8c195e713211f9f6258baafc445149355b # v1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run eslint Checks
        run: |
          npx eslint ${{steps.files.outputs.added_modified}} --fix

      - run: git diff --exit-code

      - name: Eslint Error message
        if: ${{ failure() }}
        run: |
          echo 'Eslint failure. Ensure you run `npm run lint:fix` and commit the files.'

  secret-paths:
    name: Verify generated secret paths
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout transformer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
          path: rudder-transformer

      - name: Checkout integrations-config main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: rudderlabs/rudder-integrations-config
          ref: main
          path: rudder-integrations-config

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: rudder-transformer/.nvmrc
          cache: npm
          cache-dependency-path: rudder-transformer/package-lock.json

      - name: Install dependencies
        working-directory: rudder-transformer
        run: npm ci && npm run prepare

      - name: Check deterministic artifact
        working-directory: rudder-transformer
        env:
          SECRET_PATHS_INTEGRATIONS_CONFIG: ../rudder-integrations-config/src/configurations/destinations
        run: npm run check:secret-paths
