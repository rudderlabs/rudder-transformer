version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      # Split security updates so one failing bump doesn't block the rest.
      # Major version bumps are left out and raised as separate PRs.
      security-prod:
        applies-to: security-updates
        dependency-type: 'production'
        update-types:
          - 'patch'
          - 'minor'
      security-dev:
        applies-to: security-updates
        dependency-type: 'development'
        update-types:
          - 'patch'
          - 'minor'
