name: Sync Secret-Path Manifest

on:
  repository_dispatch:
    types:
      - regenerate-secret-path-manifest
  workflow_dispatch:

concurrency:
  group: sync-secret-path-manifest
  cancel-in-progress: true

permissions:
  contents: read

env:
  INTEGRATIONS_CONFIG_REF: main
  MANIFEST_PATH: src/secretPaths/secretPaths.json
  ROLLING_BRANCH: fix/sync-secret-path-manifest
  PR_TITLE: 'ci(secret-paths): regenerate manifest'

jobs:
  sync:
    name: Regenerate manifest and maintain rolling PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Keep this contract aligned with dispatch-secretkeys-sync.yml in
      # rudder-integrations-config. Payload values are validation markers only;
      # no caller-provided value is used as a ref, path, or command fragment.
      # `on.repository_dispatch.types` already filters the event action. The
      # sender is not pinned: dispatching already requires write access here.
      - name: Validate dispatch origin
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_SOURCE" != "rudder-integrations-config" ]]; then
            echo "::error::Unrecognized secret-path manifest dispatch origin."
            exit 1
          fi

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout transformer develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      # The generator reads only `<destination>/db-config.json` from this directory.
      - name: Checkout integrations-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rudderlabs/rudder-integrations-config
          ref: ${{ env.INTEGRATIONS_CONFIG_REF }}
          path: .integrations-config
          sparse-checkout: src/configurations/destinations

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm ci runs the root `prepare` lifecycle (isolated-vm rebuild) itself.
      - name: Install transformer dependencies
        env:
          HUSKY: '0'
        run: npm ci

      # A newer integrations-config merge sends a fresh dispatch, and `concurrency` cancels this run
      # in its favour, so the checked-out revision is the one the manifest is generated from.
      - name: Regenerate manifest
        id: regenerate
        run: |
          set -euo pipefail

          # Generator output names secret paths, so it stays out of the log.
          export SECRET_PATHS_INTEGRATIONS_CONFIG="$GITHUB_WORKSPACE/.integrations-config/src/configurations/destinations"
          if ! npm run generate:secret-paths > /dev/null 2>&1; then
            echo "::error::Secret-path manifest generation failed; rerun the generator locally for details."
            exit 1
          fi

          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed secret-path manifest is current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The secret-path manifest requires an update."
          fi

      # Needed on both paths: a current manifest still closes a stale rolling PR.
      - name: Generate scoped write token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: rudder-transformer

      # GitHub allows at most one open PR per head/base pair; a fork branch with the same name is ignored.
      - name: Find the open rolling pull request
        id: rolling-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$ROLLING_BRANCH" \
            --base develop \
            --state open \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      # Merging a stale rolling PR would revert whatever brought develop up to date.
      - name: Close the stale rolling pull request
        if: steps.regenerate.outputs.changed == 'false' && steps.rolling-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.rolling-pr.outputs.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Closing: \`develop\` already contains the current secret-path manifest."

      # The branch only ever carries the regenerated manifest, so each run rebuilds it as one commit on
      # the current develop instead of stacking commits on an old base that can conflict. The commit is
      # built first and the ref moved once: pointing the head at a commit already in develop, even
      # briefly, would make GitHub mark the open rolling PR as merged.
      - name: Update fixed branch through the Git Data API
        if: steps.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse HEAD)

          # The commits lookup fails when the branch does not exist yet. Skip a no-op rewrite: it would
          # re-run CI on an identical PR. The API `sha` is the git blob SHA, so it compares to the
          # local blob directly.
          branch_exists=false
          if branch_parent_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ROLLING_BRANCH}" --jq '.parents[0].sha' 2>/dev/null); then
            branch_exists=true
            branch_blob_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${MANIFEST_PATH}?ref=${ROLLING_BRANCH}" --jq '.sha')
            if [[ "$branch_parent_sha" == "$base_sha" && "$branch_blob_sha" == "$(git hash-object "$MANIFEST_PATH")" ]]; then
              echo "The fixed branch already contains the refreshed manifest on current develop."
              exit 0
            fi
          fi

          # --rawfile keeps the file byte-for-byte, so the new blob matches `git hash-object` above.
          tree_sha=$(jq -n \
            --arg base_tree "$(git rev-parse "HEAD^{tree}")" \
            --arg path "$MANIFEST_PATH" \
            --rawfile content "$MANIFEST_PATH" \
            '{base_tree: $base_tree, tree: [{path: $path, mode: "100644", type: "blob", content: $content}]}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha')
          commit_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message="$PR_TITLE" \
            -f tree="$tree_sha" \
            -f "parents[]=$base_sha" \
            --jq '.sha')

          if [[ "$branch_exists" == "true" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ROLLING_BRANCH}" \
              -f sha="$commit_sha" \
              -F force=true \
              --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${ROLLING_BRANCH}" \
              -f sha="$commit_sha" \
              --silent
          fi

      - name: Create or update the rolling pull request
        if: steps.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.rolling-pr.outputs.number }}
        run: |
          set -euo pipefail

          integrations_config_sha=$(git -C .integrations-config rev-parse HEAD)
          body_path="$RUNNER_TEMP/secret-path-pr-body.md"
          cat > "$body_path" <<EOF
          ## Summary

          Regenerates the transformer-owned secret-path manifest from current transformer \`develop\` and rudder-integrations-config \`${INTEGRATIONS_CONFIG_REF}\`.

          - Integrations-config revision: \`${integrations_config_sha}\`
          - Rolling branch: \`${ROLLING_BRANCH}\`
          - App credentials: \`vars.RELEASE_APP_ID\` and \`secrets.RELEASE_PRIVATE_KEY\`

          The changed destinations are in this PR's diff. The workflow does not repeat them, or any credential values, fixture secrets, or raw secret paths, in the body or the run log.
          EOF

          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$ROLLING_BRANCH" \
              --base develop \
              --title "$PR_TITLE" \
              --body-file "$body_path"
          else
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body-file "$body_path"
          fi
