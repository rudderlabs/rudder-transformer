bindings:
  - name: handleRtTfSingleEventError
    path: ../../../../v0/util/index
  - name: isDefinedAndNotNull
    path: ../../../../v0/util
  - name: deferRepeatClaims
    path: ./utils

steps:
  - name: validateInput
    template: |
      $.assert(Array.isArray(^) && ^.length > 0, "Invalid event array")

  - name: transform
    externalWorkflow:
      path: ./procWorkflow.yaml
    loopOverInput: true

  - name: claimCheckedResults
    template: |
      $.deferRepeatClaims($.outputs.transform)

  - name: successfulEvents
    template: |
      $.outputs.claimCheckedResults#idx{$.isDefinedAndNotNull(.output)}.({
        "batchedRequest": .output,
        "batched": false,
        "destination": ^[idx].destination,
        "metadata": ^[idx].metadata[],
        "statusCode": .outputs.statusCode
      })[]
  - name: failedEvents
    template: |
      $.outputs.claimCheckedResults#idx.error.(
        $.handleRtTfSingleEventError(^[idx], .originalError ?? ., {})
      )[]
  - name: finalPayload
    template: |
      [...$.outputs.successfulEvents, ...$.outputs.failedEvents]
