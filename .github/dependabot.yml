version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/.github/scripts/integrations_audit' # tools of the Integration Audit workflow
    schedule:
      interval: 'daily'
