name: Integration Audit

# Checks partner changelogs against what each integration's README says it uses,
# then creates or updates one Linear parent per integration with a subticket per change type.
#
# The audit agent reads untrusted partner pages and has a shell, so it runs in its own job with only
# the Cursor key. The Linear and Slack secrets live in the other jobs, which use a fresh checkout and
# read the agent's output as data only:
#   filed   (Linear)       → items already on audit tickets, for the agent to recognise repeats
#   audit   (Cursor)       → one agent call per integration, findings as an artifact
#   tickets (Linear+Slack) → plan, create/update tickets, notify Slack
#
# The branch is the one the run starts from: the "Use workflow from" picker for a manual run (branches
# of this repo only), develop for the schedule. A scheduled run audits every integration, tickets on.
on:
  schedule:
    - cron: '0 9 1 */2 *' # every 2 months on the 1st at 9 AM UTC, like the Integration Version Audit
  workflow_dispatch:
    inputs:
      create_tickets:
        description: Create and update Linear tickets (off = plan only, shown in the run summary)
        type: boolean
        required: true
        default: true
      integrations:
        description: Comma-separated integration folder names (empty = all with an audit-ready README)
        required: false
        default: ''
      lookback_days:
        description: Days of partner changes to check (62 covers the 2-month schedule)
        required: false
        default: '62'
      model:
        description: Cursor model (empty = Cursor's default, Auto routing)
        required: false
        default: ''
      timeout_sec:
        description: Time limit per integration in seconds (raise it to rerun integrations that timed out)
        required: false
        default: '300'

permissions: {}

concurrency:
  group: integrations-audit
  cancel-in-progress: false

env:
  # Cursor CLI release and the sha256 Cursor publishes next to each tarball (<url>.sha256).
  CURSOR_CLI_VERSION: 2026.11.19-f005e9d
  CURSOR_CLI_SHA256_X64: a25986eaf0c9330aeeec599a139711cb9f267c64562d073a72b751edf5161695
  CURSOR_CLI_SHA256_ARM64: 5ff05be0d7c0b7754574dbcd677c35254a3ff190ed6457e71bbee0f276237e29
  # The agent runs in this image (Node from .nvmrc, with curl and git for the agent's shell).
  AGENT_IMAGE: node:22.23.4-bookworm@sha256:7702d8aa4d5910871692af4480eb3ba86f23047a6417a44d857d06c95d060d3f

jobs:
  filed:
    name: Read filed audit items
    if: (github.event_name == 'schedule' || inputs.create_tickets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to checkout repository code (actions/checkout)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Only the audit tools (tsx, @linear/sdk) from their own lockfile, not the repo's dependencies.
      # The same in every job: each job sets up its own tools, so the agent's job can't change them.
      - name: Install audit tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cp .github/scripts/integrations_audit/package.json .github/scripts/integrations_audit/package-lock.json "$RUNNER_TEMP/tools/"
          npm ci --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Read filed audit items
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          INTEGRATIONS: ${{ inputs.integrations }}
        run: tsx .github/scripts/integrations_audit/filed-items.ts --out audit-out --only "$INTEGRATIONS"

      - name: Upload filed items
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations-audit-filed
          path: audit-out/filed
          retention-days: 1

  audit:
    name: Run Integration Audit
    needs: filed
    # Runs with tickets off too, when `filed` is skipped.
    if: ${{ !cancelled() && needs.filed.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read # to checkout repository code (actions/checkout)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Only the audit tools (tsx, @linear/sdk) from their own lockfile, not the repo's dependencies.
      # The same in every job: each job sets up its own tools, so the agent's job can't change them.
      - name: Install audit tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cp .github/scripts/integrations_audit/package.json .github/scripts/integrations_audit/package-lock.json "$RUNNER_TEMP/tools/"
          npm ci --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # A pinned release, checked against Cursor's published sha256, instead of `curl | bash`.
      - name: Install Cursor CLI
        run: |
          case "$(uname -m)" in
            x86_64) arch=x64; sum="$CURSOR_CLI_SHA256_X64" ;;
            aarch64 | arm64) arch=arm64; sum="$CURSOR_CLI_SHA256_ARM64" ;;
            *) echo "Unsupported runner architecture $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="$RUNNER_TEMP/cursor-cli.tar.gz"
          curl -fsSL "https://downloads.cursor.com/lab/$CURSOR_CLI_VERSION/linux/$arch/agent-cli-package.tar.gz" -o "$tarball"
          echo "$sum  $tarball" | sha256sum -c -
          dir="$RUNNER_TEMP/cursor-cli"
          mkdir -p "$dir"
          tar --strip-components=1 -xzf "$tarball" -C "$dir"

      # The audit agent researches and reports; it never needs to change the repo:
      # - Cursor loads CLAUDE.md/AGENTS.md as instructions and runs Claude Code hooks from .claude/settings.json;
      #   both are for code changes, so they are removed from this throwaway checkout.
      # - .cursor/cli.json deny rules apply even with --force. Shell stays open (curl a feed, grep the code)
      #   so output quality isn't limited; only actions that never help an audit are denied.
      # - The agent runs in a container (next step), so it can't reach the runner: no ACTIONS_RUNTIME_TOKEN
      #   (Actions cache writes), no action code of later steps, no host sudo.
      - name: Protect the checkout from the audit agent
        run: |
          rm -f CLAUDE.md AGENTS.md .claude/settings.json .claude/settings.local.json
          mkdir -p .cursor
          cat > .cursor/cli.json <<'JSON'
          {
            "permissions": {
              "allow": ["Read(**)", "WebFetch(*)"],
              "deny": ["Write(src/**)", "Write(.github/**)", "Write(audit-out/**)", "Shell(env)", "Shell(printenv)"]
            }
          }
          JSON

      - name: Download filed items
        if: (github.event_name == 'schedule' || inputs.create_tickets)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integrations-audit-filed
          path: audit-out/filed

      # The agent reads untrusted partner pages and has a shell, so it runs in a container: non-root,
      # no capabilities, the checkout read-only, only audit-out writable, and only the Cursor key passed.
      # The runner's token, the code of later steps and host sudo stay out of reach.
      - name: Audit integrations
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          INTEGRATIONS: ${{ inputs.integrations }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MODEL: ${{ inputs.model }}
          TIMEOUT_SEC: ${{ inputs.timeout_sec }}
        run: |
          args=(--lookback-days "${LOOKBACK_DAYS:-62}" --concurrency 4 --timeout-sec "${TIMEOUT_SEC:-300}" --out audit-out)
          if [ -n "$INTEGRATIONS" ]; then args+=(--only "$INTEGRATIONS"); fi
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          mkdir -p audit-out
          chmod -R a+rwX audit-out
          status=0
          docker run --rm --user node --cap-drop ALL --security-opt no-new-privileges \
            -e CURSOR_API_KEY \
            -e PATH=/tools/node_modules/.bin:/cursor-cli:/usr/local/bin:/usr/bin:/bin \
            -v "$PWD:/repo:ro" -v "$PWD/audit-out:/repo/audit-out" \
            -v "$RUNNER_TEMP/tools:/tools:ro" -v "$RUNNER_TEMP/cursor-cli:/cursor-cli" \
            -w /repo "$AGENT_IMAGE" \
            tsx .github/scripts/integrations_audit/run.ts "${args[@]}" || status=$?
          if [ -f audit-out/summary.md ]; then cat audit-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations-audit-findings
          path: audit-out/findings
          if-no-files-found: ignore
          retention-days: 14

  tickets:
    name: Plan tickets and notify
    needs: [filed, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to checkout repository code (actions/checkout)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Only the audit tools (tsx, @linear/sdk) from their own lockfile, not the repo's dependencies.
      # The same in every job: each job sets up its own tools, so the agent's job can't change them.
      - name: Install audit tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cp .github/scripts/integrations_audit/package.json .github/scripts/integrations_audit/package-lock.json "$RUNNER_TEMP/tools/"
          npm ci --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # Findings are the agent's output: plan-tickets.ts and slack-message.ts read them as data and
      # validate them again. They are downloaded after a failed audit too, for the Slack message.
      - name: Download findings and filed items
        if: needs.audit.result == 'success' || needs.audit.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integrations-audit-{findings,filed}
          path: artifacts

      - name: Collect audit output
        if: always()
        run: |
          mkdir -p audit-out
          if [ -d artifacts/integrations-audit-findings ]; then cp -R artifacts/integrations-audit-findings audit-out/findings; fi
          if [ -d artifacts/integrations-audit-filed ]; then cp -R artifacts/integrations-audit-filed audit-out/filed; fi

      - name: Plan Linear tickets
        id: plan
        if: needs.audit.result == 'success'
        run: |
          tsx .github/scripts/integrations_audit/plan-tickets.ts --out audit-out
          cat audit-out/plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create and update Linear tickets
        if: (github.event_name == 'schedule' || inputs.create_tickets) && steps.plan.outcome == 'success'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          status=0
          tsx .github/scripts/integrations_audit/create-tickets.ts --out audit-out || status=$?
          if [ -f audit-out/tickets.md ]; then cat audit-out/tickets.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload audit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations-audit
          path: |
            audit-out/plan.json
            audit-out/plan.md
            audit-out/tickets.md
          if-no-files-found: ignore
          retention-days: 14

      # Same channel and format as the Integration Version Audit. The run fails when any job failed.
      # tsx may be missing if setup failed, so a plain failure message (same heading and team as
      # slack-message.ts) is the fallback.
      - name: Build Slack message
        id: message
        if: always()
        env:
          JOB_STATUS: ${{ (needs.filed.result == 'failure' || needs.audit.result != 'success' || job.status != 'success') && 'failure' || 'success' }}
          CREATE_TICKETS: ${{ github.event_name == 'schedule' || inputs.create_tickets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/integrations_audit.yml
        run: |
          if ! text=$(tsx .github/scripts/integrations_audit/slack-message.ts --out audit-out); then
            text=$(jq -n --arg t ":x: *Integration Audit (Rudder Transformer) failed*"$'\n'"<$RUN_URL|View workflow run>"$'\n'"CC: <!subteam^S02AEQL26CT>" '$t')
          fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        continue-on-error: true
        with:
          method: chat.postMessage
          errors: true
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_INTEGRATION_DEV_CHANNEL_ID }}",
              "text": ${{ steps.message.outputs.text }}
            }
