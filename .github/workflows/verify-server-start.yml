name: Verify Server start

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout repository code (actions/checkout)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci && npm run prepare

      - name: Build Project
        run: npm run build

      - name: Verify Server Startup (no cluster)
        working-directory: ./dist
        run: ../.github/scripts/verifyServerStart.sh
        env:
          CLUSTER_ENABLED: 'false'
          STATS_CLIENT: 'prometheus'

      - name: Verify Server Startup (cluster with 4 workers)
        working-directory: ./dist
        run: ../.github/scripts/verifyServerStart.sh
        env:
          CLUSTER_ENABLED: 'true'
          NUM_PROCS: '4'
          STATS_CLIENT: 'prometheus'
          CLUSTER_MANAGER_SHUTDOWN_TIMEOUT: '5000'
