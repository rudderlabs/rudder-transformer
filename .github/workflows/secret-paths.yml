name: Secret Paths

# Fails a PR whose secret-path manifest no longer matches what the code derives.
#
# The manifest says which fields of each destination's outbound request carry credentials, so the
# data plane can mask them before showing a live event. It is generated, not authored, which is
# what lets this run on every PR: a new destination, a transform that moves a credential from a
# header into the body, or a `secretKeys` change upstream all change what the generator derives,
# and each fails here until the artifact is regenerated and committed.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The derivation's second input: `secretKeys` comes from another repo.
  #
  # This tracks a branch, which means a `secretKeys` merge there with masking consequences can
  # turn a transformer PR red that did not cause it - and the committed manifest records no ref,
  # so you cannot tell from the artifact which `secretKeys` it was derived against. The trade is
  # deliberate for now: a SHA here would be reproducible but would silently stop picking up new
  # `secretKeys` until someone remembered to bump it, which fails in the unsafe direction.
  #
  # The durable fix is to record the resolved SHA in the manifest and have this job check out the
  # ref the manifest names, so provenance and pin cannot disagree. Not built yet.
  INTEGRATIONS_CONFIG_REF: develop

jobs:
  check:
    runs-on: ubuntu-latest
    name: Manifest matches derivation
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout integrations-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rudderlabs/rudder-integrations-config
          ref: ${{ env.INTEGRATIONS_CONFIG_REF }}
          path: .integrations-config
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci && npm run prepare

      - name: Check manifest is up to date
        run: |
          npm run secret-paths:check -- \
            --integrations-config=.integrations-config/src/configurations/destinations

      # Reports rather than gates: a handful of fixture secrets are short or dual-use (`1234`)
      # and collide with ordinary data, so this cannot be a hard failure until those fixtures are
      # made distinctive. Kept in the run so the numbers stay visible in the log.
      - name: Replay corpus against committed paths
        run: |
          npm run secret-paths:validate -- \
            --integrations-config=.integrations-config/src/configurations/destinations
