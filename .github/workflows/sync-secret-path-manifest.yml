name: Sync Secret-Path Manifest

on:
  repository_dispatch:
    types:
      - regenerate-secret-path-manifest
  workflow_dispatch:

concurrency:
  group: sync-secret-path-manifest
  cancel-in-progress: true

permissions:
  contents: read

env:
  INTEGRATIONS_CONFIG_REF: main
  MANIFEST_PATH: src/secretPaths/secretPaths.json
  ROLLING_BRANCH: fix/sync-secret-path-manifest
  PR_TITLE: 'ci(secret-paths): regenerate manifest (RUD-3251)'

jobs:
  sync:
    name: Regenerate manifest and maintain rolling PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Keep this contract aligned with dispatch-secretkeys-sync.yml in
      # rudder-integrations-config. Payload values are validation markers only;
      # no caller-provided value is used as a ref, path, or command fragment.
      - name: Validate trigger origin
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SOURCE: ${{ github.event.client_payload.source }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_REPOSITORY" != "rudderlabs/rudder-transformer" || "$EVENT_REF" != "refs/heads/develop" ]]; then
              echo "::error::Manual runs are allowed only for rudderlabs/rudder-transformer develop."
              exit 1
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" != "repository_dispatch" || \
                "$EVENT_ACTION" != "regenerate-secret-path-manifest" || \
                "$EVENT_ACTOR" != "rudderstack-github-actions[bot]" || \
                "$EVENT_SOURCE" != "rudder-integrations-config" ]]; then
            echo "::error::Unrecognized secret-path manifest dispatch origin."
            exit 1
          fi

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout transformer develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Checkout integrations-config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rudderlabs/rudder-integrations-config
          ref: ${{ env.INTEGRATIONS_CONFIG_REF }}
          path: .integrations-config

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm ci runs the root `prepare` lifecycle (isolated-vm rebuild) itself.
      - name: Install transformer dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Record input revisions
        id: inputs
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "integrations_config_sha=$(git -C .integrations-config rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Regenerate manifest
        run: |
          if ! npm run secret-paths -- \
            --integrations-config=.integrations-config/src/configurations/destinations \
            > /dev/null 2>&1; then
            echo "::error::Secret-path manifest generation failed; rerun the generator locally for details."
            exit 1
          fi

      - name: Refresh upstream and finalize generated manifest
        id: freshness
        env:
          INITIAL_INTEGRATIONS_CONFIG_SHA: ${{ steps.inputs.outputs.integrations_config_sha }}
        run: |
          set -euo pipefail

          git -C .integrations-config fetch --no-tags --depth=1 origin "$INTEGRATIONS_CONFIG_REF"
          current_integrations_config_sha=$(git -C .integrations-config rev-parse FETCH_HEAD)

          if [[ "$current_integrations_config_sha" != "$INITIAL_INTEGRATIONS_CONFIG_SHA" ]]; then
            git -C .integrations-config checkout --detach "$current_integrations_config_sha"
            if ! npm run secret-paths -- \
              --integrations-config=.integrations-config/src/configurations/destinations \
              > /dev/null 2>&1; then
              echo "::error::Secret-path manifest regeneration failed after refreshing integrations-config."
              exit 1
            fi
          fi

          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed secret-path manifest is current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The secret-path manifest requires an update."
          fi
          echo "integrations_config_sha=$current_integrations_config_sha" >> "$GITHUB_OUTPUT"

      - name: Summarize changed destination entries
        if: steps.freshness.outputs.changed == 'true'
        id: summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const manifestPath = process.env.MANIFEST_PATH;
          const committed = JSON.parse(execFileSync('git', ['show', `HEAD:${manifestPath}`], { encoding: 'utf8' }));
          const generated = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const before = committed.destinations ?? {};
          const after = generated.destinations ?? {};
          const names = [...new Set([...Object.keys(before), ...Object.keys(after)])]
            .filter((name) => JSON.stringify(before[name]) !== JSON.stringify(after[name]))
            .sort();

          const safeNames = names.every((name) => /^[A-Z0-9_]+$/.test(name));
          const visibleNames = names.slice(0, 50);
          const suffix = names.length > visibleNames.length ? `, and ${names.length - 50} more` : '';
          const summary = safeNames && names.length > 0
            ? `${names.length} destination entries: ${visibleNames.join(', ')}${suffix}`
            : `${names.length} destination entries`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed_destinations=${summary}\n`);
          NODE

      - name: Generate scoped write token
        if: steps.freshness.outputs.changed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: rudder-transformer

      - name: Update fixed branch through the Contents API
        if: steps.freshness.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
        run: |
          set -euo pipefail

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${ROLLING_BRANCH}" --silent 2>/dev/null; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${ROLLING_BRANCH}" \
              -f sha="$BASE_SHA" \
              --silent
          fi

          # The Contents API `sha` is the git blob SHA, so compare it to the local blob directly.
          branch_blob_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${MANIFEST_PATH}?ref=${ROLLING_BRANCH}" --jq '.sha')
          if [[ "$branch_blob_sha" == "$(git hash-object "$MANIFEST_PATH")" ]]; then
            echo "The fixed branch already contains the refreshed manifest."
            exit 0
          fi

          # The file SHA makes a concurrent or newer branch update fail with 409 instead of being overwritten.
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${MANIFEST_PATH}" \
            -f message="$PR_TITLE" \
            -f content="$(base64 -w 0 "$MANIFEST_PATH")" \
            -f branch="$ROLLING_BRANCH" \
            -f sha="$branch_blob_sha" \
            --silent

      - name: Create or update the rolling pull request
        if: steps.freshness.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          CHANGED_DESTINATIONS: ${{ steps.summary.outputs.changed_destinations }}
          INTEGRATIONS_CONFIG_SHA: ${{ steps.freshness.outputs.integrations_config_sha }}
        run: |
          set -euo pipefail

          body_path="$RUNNER_TEMP/secret-path-pr-body.md"
          cat > "$body_path" <<EOF
          ## Summary

          Regenerates the transformer-owned secret-path manifest from current transformer \`develop\` and rudder-integrations-config \`${INTEGRATIONS_CONFIG_REF}\`.

          - Changed: ${CHANGED_DESTINATIONS}
          - Integrations-config revision: \`${INTEGRATIONS_CONFIG_SHA}\`
          - Rolling branch: \`${ROLLING_BRANCH}\`
          - App credentials: \`vars.RELEASE_APP_ID\` and \`secrets.RELEASE_PRIVATE_KEY\`

          The workflow intentionally reports destination identifiers only. It does not include credential values, fixture secrets, raw secret paths, or generated diff fragments.

          Resolves RUD-3251
          EOF

          # GitHub allows at most one open PR per head/base pair.
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$ROLLING_BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$ROLLING_BRANCH" \
              --base develop \
              --title "$PR_TITLE" \
              --body-file "$body_path"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body-file "$body_path"
          fi
