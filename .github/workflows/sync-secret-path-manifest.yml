name: Sync Secret-Path Manifest

on:
  repository_dispatch:
    types:
      - regenerate-secret-path-manifest
  workflow_dispatch:

concurrency:
  group: sync-secret-path-manifest
  cancel-in-progress: true

permissions:
  contents: read

env:
  INTEGRATIONS_CONFIG_REF: main
  MANIFEST_PATH: src/secretPaths/secretPaths.json
  ROLLING_BRANCH: fix/sync-secret-path-manifest

jobs:
  sync:
    name: Regenerate manifest and maintain rolling PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Keep this contract aligned with dispatch-secretkeys-sync.yml in
      # rudder-integrations-config. Payload values are validation markers only;
      # no caller-provided value is used as a ref, path, or command fragment.
      - name: Validate trigger origin
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SOURCE: ${{ github.event.client_payload.source }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_REPOSITORY" != "rudderlabs/rudder-transformer" || "$EVENT_REF" != "refs/heads/develop" ]]; then
              echo "::error::Manual runs are allowed only for rudderlabs/rudder-transformer develop."
              exit 1
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" != "repository_dispatch" || \
                "$EVENT_ACTION" != "regenerate-secret-path-manifest" || \
                "$EVENT_ACTOR" != "rudderstack-github-actions[bot]" || \
                "$EVENT_SOURCE" != "rudder-integrations-config" ]]; then
            echo "::error::Unrecognized secret-path manifest dispatch origin."
            exit 1
          fi

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout transformer develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Checkout integrations-config main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rudderlabs/rudder-integrations-config
          ref: main
          path: .integrations-config
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install transformer dependencies
        env:
          HUSKY: '0'
        run: |
          npm ci
          npm run prepare

      - name: Save committed manifest and input revision
        id: inputs
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse HEAD)
          integrations_config_sha=$(git -C .integrations-config rev-parse HEAD)
          git show "${base_sha}:${MANIFEST_PATH}" > "$RUNNER_TEMP/committed-secret-paths.json"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "integrations_config_sha=$integrations_config_sha" >> "$GITHUB_OUTPUT"

      - name: Regenerate manifest
        run: |
          set -euo pipefail

          if ! npm run secret-paths -- \
            --integrations-config=.integrations-config/src/configurations/destinations \
            > "$RUNNER_TEMP/secret-path-generation.log" 2>&1; then
            echo "::error::Secret-path manifest generation failed; rerun the generator locally for details."
            exit 1
          fi

      - name: Refresh upstream and finalize generated manifest
        id: freshness
        env:
          INITIAL_INTEGRATIONS_CONFIG_SHA: ${{ steps.inputs.outputs.integrations_config_sha }}
        run: |
          set -euo pipefail

          git -C .integrations-config fetch --no-tags --depth=1 origin "$INTEGRATIONS_CONFIG_REF"
          current_integrations_config_sha=$(git -C .integrations-config rev-parse FETCH_HEAD)

          if [[ "$current_integrations_config_sha" != "$INITIAL_INTEGRATIONS_CONFIG_SHA" ]]; then
            git -C .integrations-config checkout --detach "$current_integrations_config_sha"
            if ! npm run secret-paths -- \
              --integrations-config=.integrations-config/src/configurations/destinations \
              > "$RUNNER_TEMP/secret-path-generation-refresh.log" 2>&1; then
              echo "::error::Secret-path manifest regeneration failed after refreshing integrations-config."
              exit 1
            fi
          fi

          if cmp -s "$RUNNER_TEMP/committed-secret-paths.json" "$MANIFEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed secret-path manifest is current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The secret-path manifest requires an update."
          fi
          echo "integrations_config_sha=$current_integrations_config_sha" >> "$GITHUB_OUTPUT"

      - name: Summarize changed destination entries
        if: steps.freshness.outputs.changed == 'true'
        id: summary
        env:
          COMMITTED_MANIFEST: ${{ runner.temp }}/committed-secret-paths.json
          GENERATED_MANIFEST: ${{ env.MANIFEST_PATH }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const committed = JSON.parse(fs.readFileSync(process.env.COMMITTED_MANIFEST, 'utf8'));
          const generated = JSON.parse(fs.readFileSync(process.env.GENERATED_MANIFEST, 'utf8'));
          const before = committed.destinations ?? {};
          const after = generated.destinations ?? {};
          const names = [...new Set([...Object.keys(before), ...Object.keys(after)])]
            .filter((name) => JSON.stringify(before[name]) !== JSON.stringify(after[name]))
            .sort();

          const safeNames = names.every((name) => /^[A-Z0-9_]+$/.test(name));
          const visibleNames = names.slice(0, 50);
          const suffix = names.length > visibleNames.length ? `, and ${names.length - 50} more` : '';
          const summary = safeNames && names.length > 0
            ? `${names.length} destination entries: ${visibleNames.join(', ')}${suffix}`
            : `${names.length} destination entries`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed_destinations=${summary}\n`);
          NODE

      - name: Generate scoped write token
        if: steps.freshness.outputs.changed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: rudder-transformer

      - name: Update fixed branch through the Contents API
        if: steps.freshness.outputs.changed == 'true'
        id: update-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE_SHA: ${{ steps.inputs.outputs.base_sha }}
        run: |
          set -euo pipefail

          refs_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${ROLLING_BRANCH}")
          branch_head=$(jq -r \
            --arg ref "refs/heads/${ROLLING_BRANCH}" \
            '[.[] | select(.ref == $ref) | .object.sha] | if length == 0 then "" elif length == 1 then .[0] else error("duplicate fixed branch refs") end' \
            <<< "$refs_json")

          if [[ -z "$branch_head" ]]; then
            jq -n \
              --arg ref "refs/heads/${ROLLING_BRANCH}" \
              --arg sha "$BASE_SHA" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/create-fixed-branch.json"
            branch_head=$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              --input "$RUNNER_TEMP/create-fixed-branch.json" \
              --jq '.object.sha')
          fi

          branch_file_json=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/${MANIFEST_PATH}" \
            -f ref="$ROLLING_BRANCH")
          branch_blob_sha=$(jq -r '.sha' <<< "$branch_file_json")
          jq -r '.content' <<< "$branch_file_json" | tr -d '\n' | base64 --decode \
            > "$RUNNER_TEMP/fixed-branch-secret-paths.json"

          if cmp -s "$RUNNER_TEMP/fixed-branch-secret-paths.json" "$MANIFEST_PATH"; then
            echo "The fixed branch already contains the refreshed manifest."
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_content=$(base64 -w 0 "$MANIFEST_PATH")
          jq -n \
            --arg message "ci(secret-paths): regenerate manifest (RUD-3251)" \
            --arg content "$manifest_content" \
            --arg branch "$ROLLING_BRANCH" \
            --arg sha "$branch_blob_sha" \
            '{message: $message, content: $content, branch: $branch, sha: $sha}' \
            > "$RUNNER_TEMP/update-secret-paths.json"

          # The file SHA makes a concurrent or newer branch update fail with 409 instead of being overwritten.
          commit_sha=$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${MANIFEST_PATH}" \
            --input "$RUNNER_TEMP/update-secret-paths.json" \
            --jq '.commit.sha')
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Build safe pull request body
        if: steps.freshness.outputs.changed == 'true'
        env:
          CHANGED_DESTINATIONS: ${{ steps.summary.outputs.changed_destinations }}
          INTEGRATIONS_CONFIG_SHA: ${{ steps.freshness.outputs.integrations_config_sha }}
          PR_BODY_PATH: ${{ runner.temp }}/secret-path-pr-body.md
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const body = `## Summary

          Regenerates the transformer-owned secret-path manifest from current transformer \`develop\` and rudder-integrations-config \`main\`.

          - Changed: ${process.env.CHANGED_DESTINATIONS}
          - Integrations-config revision: \`${process.env.INTEGRATIONS_CONFIG_SHA}\`
          - Rolling branch: \`fix/sync-secret-path-manifest\`
          - App credentials: \`vars.RELEASE_APP_ID\` and \`secrets.RELEASE_PRIVATE_KEY\`

          The workflow intentionally reports destination identifiers only. It does not include credential values, fixture secrets, raw secret paths, or generated diff fragments.

          Resolves RUD-3251
          `;

          fs.writeFileSync(
            process.env.PR_BODY_PATH,
            body.split('\n').map((line) => line.replace(/^ {10}/, '')).join('\n'),
          );
          NODE

      - name: Create or update the rolling pull request
        if: steps.freshness.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_BODY_PATH: ${{ runner.temp }}/secret-path-pr-body.md
        run: |
          set -euo pipefail

          prs=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$ROLLING_BRANCH" \
            --base develop \
            --state open \
            --json number)
          pr_count=$(jq 'length' <<< "$prs")

          if [[ "$pr_count" -eq 0 ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$ROLLING_BRANCH" \
              --base develop \
              --title "ci(secret-paths): regenerate manifest (RUD-3251)" \
              --body-file "$PR_BODY_PATH"
          elif [[ "$pr_count" -eq 1 ]]; then
            pr_number=$(jq -r '.[0].number' <<< "$prs")
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ci(secret-paths): regenerate manifest (RUD-3251)" \
              --body-file "$PR_BODY_PATH"
          else
            echo "::error::More than one open pull request uses the fixed secret-path branch."
            exit 1
          fi
